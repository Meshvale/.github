name: Feature request
description: Propose a capability for this product.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain the workflow and why the current product does not meet it.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe observable behavior and useful examples.
    validations:
      required: true
